[project]
name = "mia-ingestor"
version = "0.1.0"
description = "Flight data ingestion service for MIA Flight Tracker"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Conservative, high-signal rules: pycodestyle, pyflakes, import sorting,
# pyupgrade, flake8-bugbear.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is enforced by black, not ruff
