name: Security Gates

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  changed-paths:
    name: Detect security-relevant path changes
    runs-on: ubuntu-latest
    outputs:
      web_changed: ${{ steps.filter.outputs.web }}
      ingestor_changed: ${{ steps.filter.outputs.ingestor }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/security-gates.yml'
            ingestor:
              - 'apps/ingestor/**'
              - '.github/workflows/security-gates.yml'

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so leaked-then-removed secrets are still caught
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner --verbose

  node-audit:
    name: Web production dependency audit
    needs: changed-paths
    if: needs.changed-paths.outputs.web_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate lockfile for audit
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  python-audit:
    name: Ingestor Python dependency audit
    needs: changed-paths
    if: needs.changed-paths.outputs.ingestor_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ingestor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Audit Python dependencies from requirements lockset
        run: pip-audit --strict -r requirements.txt
